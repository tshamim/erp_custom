# Coolify deployment. In Coolify: Build Pack = Docker Compose, Docker Compose Location =
# /docker-compose.coolify.yml. See COOLIFY.md for the full walkthrough.
#
# Differences from docker-compose.yml + docker-compose.prod.yml:
#   * No host ports and no Caddy: Coolify's proxy (Traefik) terminates TLS and routes the domains
#     you assign to `web` (port 3100) and `api` (port 4100) in the Coolify UI.
#   * No env_file: every variable is set in Coolify's Environment Variables tab. `${VAR:?}` marks
#     the ones Coolify must have before it will deploy.
#   * No fixed image names, so two Coolify resources on one server cannot overwrite each other's images.
#   * `exclude_from_hc` is a Coolify-only key; this file is not meant for plain `docker compose`.

x-backend-env: &backend_env
  NODE_ENV: production
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_ADMIN_USER: ${PG_ADMIN_USER:-erp}
  PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:?}
  CONTROL_DATABASE_URL: postgres://${PG_ADMIN_USER:-erp}:${PG_ADMIN_PASSWORD:?}@postgres:5432/erp_control
  # Tenant rows store the host they were provisioned from; inside the network it is `postgres`.
  TENANT_DB_HOST: postgres
  TENANT_DB_PORT: "5432"
  TENANT_SECRET_KEY: ${TENANT_SECRET_KEY:?}
  TENANT_POOL_MAX: ${TENANT_POOL_MAX:-50}
  JWT_SECRET: ${JWT_SECRET:?}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
  API_PORT: "4100"
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-erp}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
  MINIO_BUCKET: ${MINIO_BUCKET:-erp-attachments}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
  MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID:-}
  MAIL_FROM: ${MAIL_FROM:-no-reply@eclecticerp.app}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Eclectic ERP}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  BRAND_NAME: ${BRAND_NAME:-Eclectic ERP}
  APP_URL: ${APP_URL:?}
  MAIL_TENANT_SUBDOMAINS: ${MAIL_TENANT_SUBDOMAINS:-false}
  MAIL_MIN_INTERVAL_MS: ${MAIL_MIN_INTERVAL_MS:-2000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-erp}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?}
      POSTGRES_DB: erp_control
    # Tune to the server: shared_buffers ~25% of RAM, effective_cache_size ~50%.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=2000
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-erp} -d erp_control"]
      interval: 5s
      retries: 10

  minio:
    # MinIO stopped publishing images (minio/minio, quay.io/minio/minio) in late 2025; Chainguard
    # still builds it from source. Its default user cannot write to a fresh volume, so run as root
    # as the old image did — existing data volumes stay compatible.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-erp}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      retries: 10

  # One-shot: control-plane schema + pending migrations for every company database, on every deploy.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: "no"
    exclude_from_hc: true
    depends_on:
      postgres: { condition: service_healthy }
    environment: *backend_env
    command: sh -c "node packages/db/dist/cli/migrate-control.js && node packages/db/dist/cli/migrate-tenants.js"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *backend_env
    expose: ["4100"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time: the public HTTPS address of the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        # The web hostname without https:// (erp.example.com). Without it the first label of that
        # hostname ("erp") is taken for a Company ID and the login form locks to it.
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:?}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    expose: ["3100"]

volumes:
  pgdata:
  miniodata:
